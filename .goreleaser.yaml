# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gopkg

release:
  header: |
    Install the latest Linux x86-64 release:

    ```sh
    mkdir -p ~/bin
    curl -fSL https://github.com/rytsh/gopkg/releases/latest/download/gopkg_Linux_x86_64.tar.gz | tar -xz --overwrite -C ~/bin/ gopkg
    ```
  footer: |
    **Full Changelog**: https://github.com/rytsh/gopkg/compare/{{ .PreviousTag }}...{{ .Tag }}

before:
  hooks:
    - go mod tidy

builds:
  - id: gopkg
    main: ./cmd/gopkg
    binary: gopkg
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: binaries
    ids:
      - gopkg
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

dockers_v2:
  - id: gopkg
    ids:
      - gopkg
    dockerfile: ci/Dockerfile
    images:
      - ghcr.io/rytsh/gopkg
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: gopkg
      org.opencontainers.image.description: Offline Go package documentation server
      org.opencontainers.image.source: https://github.com/rytsh/gopkg
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"

checksum:
  name_template: '{{ .ProjectName }}-{{ .Version }}-checksums.txt'

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs(?:\([^)]*\))?:'
      - '^test(?:\([^)]*\))?:'
      - '^chore'
      - 'Merge pull request'
      - 'Merge branch'
